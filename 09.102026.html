<!DOCTYPE html>
<html>
<head>
    <title>STC Pollachi - TARANG</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            animation: fadeIn 2s;
        }

        /* Banner Animation */
        #banner {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
            animation: slideDown 1.5s;
        }

        #banner h1 {
            color: orange;
            animation: glow 2s infinite alternate;
        }

        #banner h2 {
            font-size: 35px;
            animation: zoom 2s infinite alternate;
        }

        /* Details Section */
        #details {
            display: flex;
            gap: 20px;
            margin: 20px;
        }

        #event_details, #reg {
            background-color: white;
            padding: 20px;
            width: 50%;
            border-radius: 10px;
            animation: slideUp 2s;
            transition: 0.5s;
        }

        #event_details:hover, #reg:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 15px orange;
        }

        h1 {
            color: orange;
        }

        /* Event Hover Effect */
        #event_details h3 {
            padding: 10px;
            background-color: lightyellow;
            transition: 0.5s;
        }

        #event_details h3:hover {
            background-color: orange;
            color: white;
            transform: scale(1.05);
        }

        /* Button Animation */
        button {
            background-color: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.5s;
        }

        button:hover {
            background-color: black;
            transform: scale(1.1);
            box-shadow: 0 0 10px orange;
        }

        input {
            padding: 8px;
            transition: 0.3s;
        }

        input:focus {
            outline: 2px solid orange;
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px orange;
            }
            to {
                text-shadow: 0 0 20px yellow;
            }
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.1);
            }
        }

    </style>
</head>

<body>

    <div id="banner">
        <h1>STC | Pollachi</h1>
        <h2>TARANG</h2>
        <p>INTER COLLEGE EVENT, 08/10/2026</p>
    </div>

    <div id="details">

        <div id="event_details">
            <h1>Event Details</h1>
            <h3>Singing</h3>
            <h3>Dancing</h3>
            <h3>Drawing</h3>
        </div>

        <div id="reg">
            <h1>Registration</h1>

            <form>
                <p>Name:</p>
                <input type="text" placeholder="Enter your name">

                <p>College:</p>
                <input type="text" placeholder="Enter college name">

                <p>Email:</p>
                <input type="email" placeholder="Enter email">

                <br><br>
                <button type="submit">Register</button>
            </form>
        </div>

    </div>

</body>
</html>
